<text x="30.0" y="862.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="11" fill="#536277" text-anchor="start">Solid arrows: process sequence. Dashed arrows: postings to and reads from the shared stock ledger. Italic notes: rules the database enforces at that step.</text>
