<text x="190.0" y="122.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Confirm sales order</text>
<text x="190.0" y="138.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">draft → lines → confirmed</text>
<rect x="552.0" y="230" width="196" height="62" rx="9" fill="#ffffff" stroke="#8a5a12" stroke-width="1.6"/>
<text x="650.0" y="254.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Approve BOM + routing</text>
<text x="650.0" y="270.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">revision, effective dates</text>
<text x="650.0" y="309.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">no BOM cycles</text>
<rect x="92.0" y="626" width="196" height="62" rx="9" fill="#ffffff" stroke="#1c6b5c" stroke-width="1.6"/>
<text x="190.0" y="650.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Receive purchased stock</text>
<text x="190.0" y="666.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">goods receipt</text>
<text x="190.0" y="705.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">posts RECEIPT</text>
<rect x="322.0" y="362" width="196" height="62" rx="9" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.6"/>
<text x="420.0" y="386.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Build production plan</text>
<text x="420.0" y="402.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">peg sales lines + legs/seats</text>
<text x="420.0" y="441.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">same item · ≤ ordered qty</text>
<rect x="552.0" y="362" width="196" height="62" rx="9" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.6"/>
<text x="650.0" y="386.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Run MRP</text>
<text x="650.0" y="402.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">explode BOM, snapshot stock</text>
<text x="650.0" y="441.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">stock netted once per plan</text>
<rect x="782.0" y="362" width="196" height="62" rx="9" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.6"/>
<text x="880.0" y="386.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Create production orders</text>
<text x="880.0" y="402.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">approved BOM + routing</text>
<text x="880.0" y="441.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">Σ orders ≤ plan line qty</text>
<rect x="782.0" y="520" width="196" height="62" rx="9" fill="#ffffff" stroke="#8b3a2e" stroke-width="1.6"/>
<text x="880.0" y="544.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Release and start order</text>
<text x="880.0" y="560.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">released → in progress</text>
<rect x="1002.0" y="626" width="196" height="62" rx="9" fill="#ffffff" stroke="#1c6b5c" stroke-width="1.6"/>
<text x="1100.0" y="650.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Issue components</text>
<text x="1100.0" y="666.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">to the order, from a location</text>
<text x="1100.0" y="705.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">≤ required · stock never &lt; 0</text>
<rect x="1002.0" y="520" width="196" height="62" rx="9" fill="#ffffff" stroke="#8b3a2e" stroke-width="1.6"/>
<text x="1100.0" y="544.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Perform operations</text>
<text x="1100.0" y="560.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">routing steps at work centers</text>
<text x="1100.0" y="511.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">steps of the order&#x27;s routing</text>
<rect x="1222.0" y="626" width="196" height="62" rx="9" fill="#ffffff" stroke="#1c6b5c" stroke-width="1.6"/>
<text x="1320.0" y="650.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Receive finished goods</text>
<text x="1320.0" y="666.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">quality inspected</text>
<text x="1320.0" y="705.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">started order · ≤ planned qty</text>
<rect x="1222.0" y="520" width="196" height="62" rx="9" fill="#ffffff" stroke="#8b3a2e" stroke-width="1.6"/>
<text x="1320.0" y="544.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle" font-weight="bold">Complete order</text>
<text x="1320.0" y="560.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="12" fill="#16263a" text-anchor="middle">record serial numbers</text>
<text x="1320.0" y="511.0" font-family="Helvetica,Arial,'Liberation Sans',sans-serif" font-size="10" fill="#536277" text-anchor="middle" font-style="italic">serials ≤ units received</text>
